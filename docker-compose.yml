version: '3.8'

services:
  app:
    build:
      context: .
      target: dev
    ports:
      - 3000:3000
    volumes:
      - ./src:/usr/src/app/src
      - ./node_modules:/usr/src/app/node_modules
    command: /usr/src/app/entrypoint.sh
  db:
    image: postgres:latest
    ports:
      - 5555:5432
    restart: always
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: rift
    volumes:
      - db:/var/lib/postgresql/data

volumes:
  db:
    driver: local
